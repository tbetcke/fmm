[package]
name = "nd-fmm-exec"
version = "0.1.0-dev"
description = "The Laplace FMM of the nd-project on nd-fmm-plan: box geometry, operators and the user-facing FMM."
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nd_fmm_exec"

# The device path (Phase 4, docs/design/device-path.md §3.4). No feature is on by
# default, so the host path builds without CubeCL.
[features]
default = []
# The device operator and the device backends' settings, through nd-fmm-kernels.
gpu = ["dep:nd-fmm-kernels"]
# The CubeCL CPU runtime; its build downloads the tracel-llvm bundle.
cpu = ["gpu", "nd-fmm-kernels/cpu"]
# Metal (wgpu with the MSL compiler): f32 only, run outside the macOS sandbox.
metal = ["gpu", "nd-fmm-kernels/metal"]
# CUDA: f32 and f64; type-checked in CI, run by hand on locust's H100 (Phase 4S).
cuda = ["gpu", "nd-fmm-kernels/cuda"]

[dependencies]
nd-fmm-math = { workspace = true }
nd-fmm-ref = { workspace = true }
nd-fmm-tables = { workspace = true }
nd-fmm-plan = { workspace = true }
nd-fmm-simd = { workspace = true }
nd-octree = { workspace = true }
mpi = { workspace = true }
rlst = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
nd-fmm-kernels = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

# How to call the FMM: build, evaluate several charge vectors, check against the direct
# sum. Registered for the weekly `run-examples` job (3 ranks), where it reports the
# refusal of points other ranks own (no redistribution before C5.1) and exits normally.
[[example]]
name = "basic_evaluation"

[package.metadata.example.basic_evaluation.templated-examples]
command = "mpirun -n {{NPROCESSES}}"
