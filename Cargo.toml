[workspace]
# Keep "2"; moving to "3" (MSRV-aware resolution) is a separate decision.
resolver = "2"
members = ["fmm-plan", "octree", "fmm-math", "fmm-ref", "fmm-validate", "fmm-tables", "fmm-exec", "spikes/cubecl-gemm", "spikes/p2p-simd"]
# Without default-members every member is built; spikes are added to members only,
# so CI never builds them.
default-members = ["octree", "fmm-plan", "fmm-math", "fmm-ref", "fmm-validate", "fmm-tables", "fmm-exec"]

# Every crate but octree/ inherits from this; octree/ keeps its own fields.
[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/tbetcke/fmm"
repository = "https://github.com/tbetcke/fmm"

[workspace.dependencies]
num-traits = "0.2"
thiserror = "2"
proptest = "1"
approx = "0.5"
serde_json = "1"
# Pinned exactly; only nd-fmm-kernels and spikes/ may use CubeCL. cubek-matmul 0.2.0
# is the matmul engine released against cubecl 0.10.0.
cubecl = { version = "=0.10.0", default-features = false, features = ["std", "stdlib"] }
cubek-matmul = { version = "=0.2.0", default-features = false, features = ["std"] }
cubek-std = { version = "=0.2.0", default-features = false }
nd-fmm-math = { path = "fmm-math" }
nd-fmm-ref = { path = "fmm-ref" }
nd-fmm-tables = { path = "fmm-tables" }
# Phase 3, at the versions octree/ uses. rlst is never given the "mpi" feature here;
# the crates that need it (nd-octree, nd-fmm-plan) enable it themselves.
mpi = { version = "0.8.2", features = ["derive"] }
rlst = "0.9.0"
rand_chacha = "0.10"
# Host threading of the Laplace FMM (Phase 3 T10); nd-fmm-exec only.
rayon = "1"
# octree/ does not use these entries yet (a separate decision).
nd-octree = { path = "octree" }
nd-fmm-plan = { path = "fmm-plan" }
nd-fmm-exec = { path = "fmm-exec" }
# Pinned by commit; only spikes/ may use it (Phase 3S T2 baseline, spikes/p2p-simd).
green-kernels = { git = "https://github.com/bempp/green-kernels", rev = "7d757c579f8633d58163cd5b2d011a9468541f17" }
# The SIMD layer green-kernels dispatches through; spikes/p2p-simd names its backend.
# Spikes only, like green-kernels.
pulp = "0.22"

# green-kernels asks for rlst from git main (0.4.0-dev), whose build dependency
# `cc = "=1.2"` cannot be resolved beside rlst 0.9.0 and mpi-sys (cc 1.5). Point it at
# the crates.io rlst 0.9.0, whose `simd` module has the same code (Phase 3S T2,
# design simd-p2p.md §8.4; decided 2026-10-02). Only green-kernels uses that source.
[patch."https://github.com/linalg-rs/rlst.git"]
rlst = "0.9.0"
