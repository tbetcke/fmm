name: 🧪 run-examples

on:
  workflow_dispatch:
  schedule:
    - cron: "1 0 * * FRI"

jobs:
  run-examples:
    name: run-examples-${{ matrix.profile }}
    runs-on: docker
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    env:
      RUST_MIN_STACK: "8388608"
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "true"

      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            cargo-downloads-${{ runner.os }}-

      - name: Install native dependencies
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libfftw3-dev libopenblas-dev openmpi-bin libopenmpi-dev

      - name: Build MPI examples
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -eu
          if [ "$PROFILE" = release ]; then
            cargo build --examples --release
          else
            cargo build --examples
          fi

      - name: Run MPI examples with one and three ranks
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -eu
          for n in 1 3; do
            for example in test_mpi_complete_tree test_mpi_global_bounding_box test_mpi_construction_edge_cases; do
              echo "Running $example ($PROFILE) with $n ranks"
              timeout --kill-after=10s 120s mpirun --oversubscribe -n "$n" "target/$PROFILE/examples/$example"
            done
          done
