name: 🧪 run-tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-tests-rust:
    name: run-tests
    runs-on: docker
    timeout-minutes: 30
    env:
      RUST_MIN_STACK: "8388608"
      # Container runners may run as root and expose fewer than three slots.
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "true"

      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            cargo-downloads-${{ runner.os }}-

      - name: Install native dependencies
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libfftw3-dev libopenblas-dev openmpi-bin libopenmpi-dev

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy (all targets, strict)
        run: cargo clippy --all-targets --features strict -- -D warnings

      - name: Run unit tests
        run: cargo test

      - name: Build docs (deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps

      - name: Build MPI examples
        run: cargo build --examples

      - name: Run MPI examples with one and three ranks
        run: |
          set -eu
          for n in 1 3; do
            for example in test_mpi_complete_tree test_mpi_global_bounding_box test_mpi_construction_edge_cases; do
              echo "Running $example with $n ranks"
              timeout --kill-after=10s 120s mpirun --oversubscribe -n "$n" "target/debug/examples/$example"
            done
          done
