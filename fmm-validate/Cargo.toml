[package]
name = "nd-fmm-validate"
version = "0.1.0-dev"
description = "Error metrics, point distributions, accuracy sweeps and timing reports for the nd-project FMM."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nd_fmm_validate"

# The device path of nd-fmm-exec, passed through (docs/design/device-path.md §3.4).
[features]
default = []
gpu = ["nd-fmm-exec/gpu"]
cpu = ["gpu", "nd-fmm-exec/cpu"]
metal = ["gpu", "nd-fmm-exec/metal"]
cuda = ["gpu", "nd-fmm-exec/cuda"]

[dependencies]
nd-fmm-math = { workspace = true }
nd-fmm-ref = { workspace = true }
nd-fmm-tables = { workspace = true }
nd-fmm-exec = { workspace = true }
nd-fmm-simd = { workspace = true }
mpi = { workspace = true }

# The device path on the host fallback (Phase 4 T5): needs a device backend; not run in
# CI (no templated-examples entry), run by hand on one rank.
[[example]]
name = "device_fallback"
required-features = ["gpu"]
