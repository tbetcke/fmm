[package]
name = "nd-fmm-validate"
version = "0.1.0-dev"
description = "Error metrics, point distributions, accuracy sweeps and timing reports for the nd-project FMM."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nd_fmm_validate"

# The device path of nd-fmm-exec and the kernels of nd-fmm-kernels, passed through
# (docs/design/device-path.md §3.4).
[features]
default = []
gpu = ["nd-fmm-exec/gpu", "dep:nd-fmm-kernels"]
cpu = ["gpu", "nd-fmm-exec/cpu", "nd-fmm-kernels/cpu"]
metal = ["gpu", "nd-fmm-exec/metal", "nd-fmm-kernels/metal"]
cuda = ["gpu", "nd-fmm-exec/cuda", "nd-fmm-kernels/cuda"]

[dependencies]
nd-fmm-math = { workspace = true }
nd-fmm-ref = { workspace = true }
nd-fmm-tables = { workspace = true }
nd-fmm-exec = { workspace = true }
nd-fmm-simd = { workspace = true }
mpi = { workspace = true }
# The device P2P rows of `p2p_kernels` (Phase 4 T6), feature `gpu`.
nd-fmm-kernels = { workspace = true, optional = true }

# The accuracy of the FMM on uniform and adaptive trees (C3.2, C3.3) on any number of ranks
# (Phase 5 T6): registered for the weekly `run-examples` job, which runs it at 3 ranks
# (136 s on the M3 Max at 3 ranks × 1 thread, 401 CPU-seconds).
[[example]]
name = "fmm_accuracy"

[package.metadata.example.fmm_accuracy.templated-examples]
command = "mpirun -n {{NPROCESSES}}"

# Strong and weak scaling of the distributed host FMM (Phase 5 T10, C5.3): on any number
# of ranks, but a timing example, so not registered with templated-examples; run by hand
# under `mpirun` (tools/scaling/run.sh).
[[example]]
name = "scaling"

# The device path on the host fallback (Phase 4 T5): needs a device backend; not run in
# CI (no templated-examples entry), run by hand on one rank.
[[example]]
name = "device_fallback"
required-features = ["gpu"]

# The device leaf operators per level against the host operator (Phase 4 T7): needs a
# device backend; not run in CI (no templated-examples entry), run by hand on one rank.
[[example]]
name = "leaf_kernels"
required-features = ["gpu"]

# The device M2M and L2L per level, GEMM throughput against the spike (Phase 4 T8): needs a
# device backend; not run in CI (no templated-examples entry), run by hand on one rank.
[[example]]
name = "translation_kernels"
required-features = ["gpu"]

# The device dense M2L per level, GEMM throughput against the spike and the C4.5 gate, the
# stage against the host (Phase 4 T9): needs a device backend; not run in CI (no
# templated-examples entry), run by hand on one rank.
[[example]]
name = "m2l_kernels"
required-features = ["gpu"]

# The device rotation M2L against the dense M2L across p, its efficiency against the spike's
# break-even values, and the M2L stage against the host rotation (Phase 4 T10): needs a
# device backend; not run in CI (no templated-examples entry), run by hand on one rank.
[[example]]
name = "rotation_kernels"
required-features = ["gpu"]

# The tuning tables of the device path per problem and degree, a rebuild from the cache,
# and the evaluation time tuned against the static rule (Phase 4 T12): needs a device
# backend; not run in CI (no templated-examples entry), run by hand on one rank.
[[example]]
name = "autotune"
required-features = ["gpu"]

# The device FMM against the host path stage by stage, and the device leaf-size study
# (Phase 4 T13): needs a device backend; not run in CI (no templated-examples entry), run
# by hand on one rank.
[[example]]
name = "device_fmm"
required-features = ["gpu"]

# The layout sweep of the device path (Phase 4S T7): every layout candidate of the device
# kernels on the FMM's own level calls; needs a device backend; not run in CI (no
# templated-examples entry), run by hand on one rank.
[[example]]
name = "layout_sweep"
required-features = ["gpu"]
