[package]
name = "nd-fmm-plan"
version = "0.1.0-dev"
authors = ["Timo Betcke"]
description = "Kernel-agnostic plan of a distributed FMM: box index, interaction lists, ghost exchange and level-batched evaluation."
readme = "README.md"
keywords = ["numerics"]
categories = ["mathematics", "science"]
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "nd_fmm_plan"

[dependencies]
nd-octree = { workspace = true }
rlst = { workspace = true, features = ["mpi"] }
mpi = { workspace = true, features = ["complex"] }

[dev-dependencies]
rand_chacha = { workspace = true }
