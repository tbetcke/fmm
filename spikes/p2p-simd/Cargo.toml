[package]
name = "nd-fmm-spike-p2p-simd"
version = "0.0.0"
description = "Throwaway benchmark: SIMD P2P loop orders, inverse square roots and the green-kernels baseline (Phase 3S, T2); the production kernel against green-kernels (T7)."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nd-fmm-math.workspace = true
nd-fmm-ref.workspace = true
green-kernels.workspace = true
pulp.workspace = true
# T7: the production kernel, and the inputs and measures of nd-fmm-validate's
# `p2p_kernels` example (nd-fmm-validate links MPI; `compare` never initialises it).
nd-fmm-simd.workspace = true
nd-fmm-validate.workspace = true

# `cargo test` runs the smoke test of `compare`'s core.
[[example]]
name = "compare"
test = true
