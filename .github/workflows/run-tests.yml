name: 🧪 run-tests

# Pull requests to main, and pushes to main so that main holds the caches every pull
# request restores from its first run on (Phase 4S decision 13, T10): a cache saved by
# a pull request is visible to that pull request only.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Caches (actions/cache, first-party only; Phase 4S decision 13):
# - cargo: keyed on the job, the rustc version (dtolnay/rust-toolchain's `cachekey`) and
#   Cargo.lock; a changed Cargo.lock restores the newest cache of the same job and rustc
#   (`restore-keys`). A hit on the exact key saves nothing.
# - packages: the .deb files of the job's package list, keyed on the runner image and the
#   list, exact keys only; .github/scripts/apt-install.sh installs them offline on a hit.
#   While GitHub rolls out a runner image, jobs land on either of two, so each job
#   downloads once per image before its runs hit.
# A failed or timed-out package install is a mirror problem; the next step says to re-run.
# timeout-minutes (T10, from the measured times): about twice a job's warm time and above
# its worst cold time with a slow mirror (an install step stops at 5 minutes).

jobs:
  run-tests-rust:
    name: run-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APT_PACKAGES: libclang-dev cmake libfftw3-dev libopenblas-dev openmpi-bin libopenmpi-dev
    steps:
      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/checkout@v6
        with:
          submodules: "true"

      - name: Cache the cargo registry and the target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: run-tests-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: run-tests-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: Package cache key (runner image and package list)
        id: apt-key
        run: echo "key=apt-$ImageOS-$ImageVersion-${{ runner.arch }}-$(echo "$APT_PACKAGES" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the downloaded packages
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-key.outputs.key }}

      - name: Install libclang, CMake, FFTW, BLAS and MPI
        id: apt
        timeout-minutes: 5
        run: .github/scripts/apt-install.sh ~/apt-archives $APT_PACKAGES

      - name: Explain a failed package install
        if: failure() && steps.apt.outcome == 'failure'
        run: echo "::error title=Package install failed::apt-get failed or timed out (5 minutes), most likely on a slow or failing Ubuntu mirror. Re-run the failed jobs."

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: |
          cargo clippy -- -D warnings
          cargo clippy --examples -- -D warnings

      - name: Run unit tests
        run: RUST_MIN_STACK=8388608 cargo test

      - name: Build docs
        run: cargo doc --no-deps

  # nd-fmm-simd alone, without MPI, on real x86_64 (AVX2 + FMA) and arm64 (NEON)
  # hardware (Phase 3S, decided 2026-10-02). The tests print the ISAs they ran;
  # --show-output puts that into the log. Correctness and accuracy only, never timings.
  run-tests-simd:
    name: run-tests-simd (${{ matrix.arch }})
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/checkout@v6

      - name: CPU and toolchain
        run: |
          lscpu
          rustc --version

      - name: Clippy
        run: cargo clippy -p nd-fmm-simd --all-targets -- -D warnings

      - name: Run tests
        run: cargo test -p nd-fmm-simd -- --show-output

      - name: Run release accuracy tests (ignored)
        run: cargo test -p nd-fmm-simd --release -- --ignored --show-output

  # nd-fmm-kernels alone on the CubeCL CPU runtime (f32 and f64), without MPI (Phase 4
  # T4; README decision 7, kept at sign-off on 2026-10-03). Correctness on small shapes only,
  # never timings of kernels. The tests print the backends they ran; --show-output puts
  # that into the log. The two measurement steps report the tracel-llvm bundle download
  # (the bundler's build-script run) and, from CubeCL's profiling log of the test run
  # (Phase 4S T10), the kernel compilation inside the tests. Since Phase 4S T2
  # (decision 6) the job also type-checks CUDA (nd-fmm-kernels and nd-fmm-exec); CUDA
  # never runs in CI.
  run-tests-kernels:
    name: run-tests-kernels (CPU runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APT_PACKAGES: libclang-dev openmpi-bin libopenmpi-dev
    steps:
      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/checkout@v6

      - name: Cache the cargo registry, the target directory and the tracel-llvm bundle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cache/tracel/
            ~/.local/share/tracel/
            target/
          key: run-tests-kernels-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: run-tests-kernels-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: CPU and toolchain
        run: |
          lscpu
          rustc --version
          rm -rf target/cargo-timings

      - name: Clippy
        run: cargo clippy -p nd-fmm-kernels --all-targets --features cpu --timings -- -D warnings

      # CUDA is type-checked here, never run (Phase 4S decision 6). The runner has no
      # nvcc, so cudarc assumes its default CUDA version, which is enough for a check.
      - name: Type-check nd-fmm-kernels with CUDA
        run: cargo check -p nd-fmm-kernels --features cuda

      # nd-fmm-exec depends on mpi (mpi-sys runs bindgen against an MPI installation).
      - name: Package cache key (runner image and package list)
        id: apt-key
        run: echo "key=apt-$ImageOS-$ImageVersion-${{ runner.arch }}-$(echo "$APT_PACKAGES" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the downloaded packages
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-key.outputs.key }}

      - name: Install MPI and libclang (for nd-fmm-exec)
        id: apt
        timeout-minutes: 5
        run: .github/scripts/apt-install.sh ~/apt-archives $APT_PACKAGES

      - name: Explain a failed package install
        if: failure() && steps.apt.outcome == 'failure'
        run: echo "::error title=Package install failed::apt-get failed or timed out (5 minutes), most likely on a slow or failing Ubuntu mirror. Re-run the failed jobs."

      - name: Type-check nd-fmm-exec with CUDA
        run: cargo check -p nd-fmm-exec --features cuda

      - name: Build the tests
        run: cargo test -p nd-fmm-kernels --features cpu --release --no-run --timings

      - name: Build measurement (bundle download and slowest units)
        run: |
          python3 - <<'PY'
          import glob, json, re
          for path in sorted(glob.glob("target/cargo-timings/cargo-timing-*.html")):
              units = json.loads(re.search(r"const UNIT_DATA = (\[.*?\]);\n", open(path).read(), re.S).group(1))
              print(f"{path}: {len(units)} units")
              bundle = [u for u in units if u["name"] == "tracel-llvm-bundler" and u["target"].strip() == "build-script (run)"]
              print("  tracel-llvm bundle (bundler build-script run):",
                    f"{bundle[0]['duration']:.1f} s" if bundle else "not run (cached)")
              for u in sorted(units, key=lambda u: -u["duration"])[:5]:
                  print(f"  {u['duration']:7.1f} s  {u['name']} {u['target'].strip()}")
          PY

      # CubeCL writes its profiling log to the file; the test output is unchanged
      # (Phase 4S T10).
      - name: Run tests
        env:
          CUBECL_DEBUG_LOG: ${{ runner.temp }}/cubecl.log
        run: cargo test -p nd-fmm-kernels --features cpu --release -- --show-output

      - name: Kernel compilation measurement (CubeCL profiling log of the test run)
        run: awk -f fmm-kernels/tools/compile_times.awk "$RUNNER_TEMP/cubecl.log"
